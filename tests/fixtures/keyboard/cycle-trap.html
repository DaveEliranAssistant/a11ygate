<!doctype html><html lang="en"><head><title>Keyboard fixture</title><style>:focus-visible{outline:3px solid blue}</style></head><body><button>One</button><button>Two</button><button>Three</button><script>const buttons=[...document.querySelectorAll("button")];document.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();buttons[(buttons.indexOf(document.activeElement)+1)%3].focus()}})</script></body></html>
