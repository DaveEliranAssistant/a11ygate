<!doctype html><html lang="en"><head><title>Keyboard fixture</title><style>:focus-visible{outline:3px solid blue}</style></head><body><button id="first">First</button><button id="second">Second</button><button id="third">Third</button><script>document.addEventListener("keydown",e=>{if(e.key==="Tab"&&e.shiftKey&&document.activeElement===third){e.preventDefault();first.focus()}})</script></body></html>
