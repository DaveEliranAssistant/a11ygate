<!doctype html><html lang="en"><head><title>Keyboard fixture</title><style>:focus-visible{outline:3px solid blue}</style></head><body><div role="tablist"><button role="tab" tabindex="0">One</button><button role="tab" tabindex="-1">Two</button><button role="tab" tabindex="-1">Three</button></div><button>Outside</button><script>const tabs=[...document.querySelectorAll('[role="tab"]')];document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown'].includes(e.key)&&tabs.includes(document.activeElement)){e.preventDefault();const next=tabs[(tabs.indexOf(document.activeElement)+1)%tabs.length];tabs.forEach(t=>t.tabIndex=t===next?0:-1);next.focus()}})</script></body></html>
