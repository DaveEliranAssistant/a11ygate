name: A11yGate
description: Fail the job on new axe-core violations and publish an accessibility regression summary.
author: A11yGate
branding:
  icon: check-square
  color: gray-dark

inputs:
  current:
    description: Paths to current axe-core JSON files, one path per line.
    required: true
  baseline:
    description: Paths to baseline axe-core JSON files, one path per line. Omit to treat every current finding as new.
    required: false
    default: ''
  threshold:
    description: Impact threshold. minor, moderate, serious, or critical.
    required: false
    default: serious
  markdown:
    description: File path for the Markdown summary. A temporary file is used when this is empty.
    required: false
    default: ''
  json:
    description: File path for the JSON result. A temporary file is used when this is empty.
    required: false
    default: ''
  update-baseline:
    description: When set, write the current results to this baseline path.
    required: false
    default: ''
  comment:
    description: Post or update a single pull request comment. true or false.
    required: false
    default: 'false'
  suggest-fixes:
    description: When comment is true, also post rule-based suggested changes as pull request review comments on lines in the diff. Needs pull-requests write. true or false.
    required: false
    default: 'true'
  suggest-lang:
    description: Language code used by the html-has-lang suggestion. A TODO(a11ygate) comment asks a human to confirm it.
    required: false
    default: en
  model-fixes:
    description: Optional model-drafted fixes (experimental; no live providers yet). on or off. Needs modelFixes true in the repository's .a11ygate.yml; cannot override a repository denial. Falls back to rule-based suggestions.
    required: false
    default: 'off'
  model-fixes-publish:
    description: How verified model drafts are published when model-fixes is on. draft-pr (a draft pull request, never marked ready, approved or merged; falls back to a review suggestion when drafts are unavailable) or review-suggestion (a review comment labelled "model-drafted, needs human review"). Needs pull-requests and contents write; without them A11yGate reports only.
    required: false
    default: draft-pr
  token:
    description: Token used to post the pull request comment. Defaults to the job token.
    required: false
    default: ${{ github.token }}

outputs:
  verdict:
    description: PASS or FAIL.
    value: ${{ steps.gate.outputs.verdict }}
  new:
    description: Count of new findings.
    value: ${{ steps.gate.outputs.new }}
  fixed:
    description: Count of fixed findings.
    value: ${{ steps.gate.outputs.fixed }}
  still-open:
    description: Count of still-open findings.
    value: ${{ steps.gate.outputs.still-open }}
  exit-code:
    description: CLI exit code. 0 pass, 1 new violations, 2 unreadable input.
    value: ${{ steps.gate.outputs.exit-code }}

runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        A11Y_CURRENT: ${{ inputs.current }}
        A11Y_BASELINE: ${{ inputs.baseline }}
        A11Y_THRESHOLD: ${{ inputs.threshold }}
        A11Y_MARKDOWN: ${{ inputs.markdown }}
        A11Y_JSON: ${{ inputs.json }}
        A11Y_UPDATE_BASELINE: ${{ inputs.update-baseline }}
        A11Y_COMMENT: ${{ inputs.comment }}
        A11Y_SUGGEST_FIXES: ${{ inputs.suggest-fixes }}
        A11Y_SUGGEST_LANG: ${{ inputs.suggest-lang }}
        A11Y_MODEL_FIXES: ${{ inputs.model-fixes }}
        A11Y_MODEL_PUBLISH: ${{ inputs.model-fixes-publish }}
        A11Y_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        A11Y_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        A11Y_TOKEN: ${{ inputs.token }}
        A11Y_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        A11Y_PR_NUMBER: ${{ github.event.pull_request.number }}
        A11Y_REPOSITORY: ${{ github.repository }}
        A11Y_API_URL: ${{ github.api_url }}
      run: node "${{ github.action_path }}/run.mjs"
