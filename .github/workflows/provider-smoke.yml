# Live provider smoke test (A11Y-R17). MANUAL ONLY.
#
# Runs scripts/modelfix-live-smoke.mjs against Groq, Gemini and Cloudflare
# Workers AI with one synthetic fixture snippet and at most one request per
# provider. It never runs on pull requests, pushes or a schedule.
#
# Each provider runs only if its repository secrets exist; otherwise it is
# reported as "skipped (not configured)" and the job still succeeds. Secrets
# are passed as environment variables only (GitHub masks them in logs), are
# never echoed, and are never written to files. The script detects them by
# presence, not by printing them, and redacts credential values from its own
# output as a second safeguard. The artifact holds provider, model, latency,
# result and token counts only — no prompts, replies or credentials.
#
# Optional repository secrets (add only if you want live runs):
#   GROQ_API_KEY, A11YGATE_MODEL_GROQ_MODEL
#   GEMINI_API_KEY, A11YGATE_MODEL_GEMINI_MODEL
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, A11YGATE_MODEL_CLOUDFLARE_MODEL
name: Provider smoke (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run live provider smoke (one synthetic request per configured provider)
        env:
          A11YGATE_LIVE_SMOKE: '1'
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          A11YGATE_MODEL_GROQ_MODEL: ${{ secrets.A11YGATE_MODEL_GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          A11YGATE_MODEL_GEMINI_MODEL: ${{ secrets.A11YGATE_MODEL_GEMINI_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          A11YGATE_MODEL_CLOUDFLARE_MODEL: ${{ secrets.A11YGATE_MODEL_CLOUDFLARE_MODEL }}
        run: node scripts/modelfix-live-smoke.mjs --json-out provider-smoke.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-smoke
          path: provider-smoke.json
          if-no-files-found: warn
          retention-days: 14
