# Copy this file to .github/workflows/ in a repository you own.
# Public GitHub.com repositories can receive this upload without enabling
# CodeQL default setup. Private repositories need GitHub Code Security
# (paid) — do not turn that on unless the owner has asked you to.
#
# Permissions: security-events: write is required. actions: read is
# required on private repositories.
# https://docs.github.com/en/code-security/how-tos/find-and-fix-code-vulnerabilities/integrate-with-existing-tools/upload-sarif-file

name: A11yGate SARIF

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cli:build
      # Exit 1 (new findings at or above the threshold) is expected for the
      # demo-shop fixture and must not skip the upload. Exit 2 is a real error.
      - name: Write SARIF
        run: |
          set +e
          node packages/cli/dist/cli.mjs ci \
            --current fixtures/demo-shop-current.json \
            --format sarif \
            --out-dir a11y-sarif
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          test -f a11y-sarif/a11ygate.sarif
      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: a11y-sarif/a11ygate.sarif
          category: a11ygate/axe
