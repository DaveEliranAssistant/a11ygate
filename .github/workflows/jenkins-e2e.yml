name: Jenkins E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'
  pull_request:
    paths:
      - 'integrations/jenkins/**'
      - '.github/workflows/jenkins-e2e.yml'
  push:
    paths:
      - 'integrations/jenkins/**'
      - '.github/workflows/jenkins-e2e.yml'

permissions:
  contents: read

concurrency:
  group: jenkins-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real Jenkins LTS + JCasC, BAD and clean fixtures
        run: bash integrations/jenkins/test/docker/run.sh
      - name: Publish assertions
        if: always()
        run: |
          if test -f test-results/jenkins-e2e/summary.md; then
            cat test-results/jenkins-e2e/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jenkins-e2e-evidence
          path: test-results/jenkins-e2e/
          retention-days: 7
